- name: Clone acados repository (shallow) with submodules
  become: true
  ansible.builtin.git:
    repo: https://github.com/acados/acados.git
    dest: /opt/acados
    version: "{{ acados_version }}"
    depth: 1
    force: true
    recursive: true

- name: Create build directory
  become: true
  ansible.builtin.file:
    path: /opt/acados/build
    state: directory
    mode: "0755"

# cspell:ignore DACADOS
- name: Configure acados with CMake
  become: true
  ansible.builtin.command:
    cmd: >
      cmake
      -DACADOS_WITH_QPOASES=ON
      -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      ..
    chdir: /opt/acados/build
  changed_when: false

- name: Build and install acados
  become: true
  ansible.builtin.command:
    cmd: make install -j{{ ansible_processor_vcpus }}
    chdir: /opt/acados/build
  changed_when: false

- name: Create acados bin directory
  become: true
  ansible.builtin.file:
    path: /opt/acados/bin
    state: directory
    mode: "0755"

- name: Set tera renderer architecture
  ansible.builtin.set_fact:
    acados_tera_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

- name: Download tera renderer
  become: true
  ansible.builtin.get_url:
    url: https://github.com/acados/tera_renderer/releases/download/{{ acados_tera_renderer_version }}/t_renderer-{{ acados_tera_renderer_version }}-linux-{{ acados_tera_arch }}
    dest: /opt/acados/bin/t_renderer
    mode: "0755"

# ---------- Python virtual environment ----------
# Single source of truth: pyproject.toml's `acados` dependency group. uv builds
# /opt/acados/.venv from scratch and installs casadi/sympy at the pinned
# versions plus acados_template editable from /opt/acados/interfaces/acados_template
# (declared as a path source in pyproject.toml).
- name: Sync acados venv from pyproject.toml acados group
  become: true
  ansible.builtin.command:
    cmd: uv sync --no-default-groups --group acados
    chdir: "{{ acados_uv_project_root }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ acados_venv_path }}"
    UV_PYTHON_INSTALL_DIR: "{{ uv_python_install_dir | default('/opt/uv/python') }}"
    UV_CACHE_DIR: "{{ uv_cache_dir | default('/opt/uv/cache') }}"
  changed_when: false

# ---------- Environment (.bashrc) ----------

- name: Add acados CMAKE_PREFIX_PATH to .bashrc
  become: true
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: export CMAKE_PREFIX_PATH="/opt/acados:${CMAKE_PREFIX_PATH}"
    regexp: CMAKE_PREFIX_PATH.*acados
    state: present
  loop:
    - "{{ ansible_env.HOME }}/.bashrc"
    - /etc/skel/.bashrc

- name: Add ACADOS_SOURCE_DIR to .bashrc
  become: true
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: export ACADOS_SOURCE_DIR="/opt/acados"
    regexp: ACADOS_SOURCE_DIR
    state: present
  loop:
    - "{{ ansible_env.HOME }}/.bashrc"
    - /etc/skel/.bashrc

- name: Add acados LD_LIBRARY_PATH to .bashrc
  become: true
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: export LD_LIBRARY_PATH="/opt/acados/lib:${LD_LIBRARY_PATH}"
    regexp: LD_LIBRARY_PATH.*acados
    state: present
  loop:
    - "{{ ansible_env.HOME }}/.bashrc"
    - /etc/skel/.bashrc
