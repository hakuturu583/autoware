name: DCO
# ref: https://github.com/anchore/syft/pull/2926/files
on:
  pull_request:
jobs:
  dco:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.18"

      - name: Sync tools group (dco-check)
        run: uv sync --frozen --no-default-groups --group tools

      - name: Check DCO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --frozen --no-default-groups --group tools \
            dco-check --verbose --exclude-pattern 'pre-commit-ci\[bot\]@users\.noreply\.github\.com'
